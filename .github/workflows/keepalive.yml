name: Supabase Keep-Alive

# Pings the Supabase database on a schedule so the free-tier project
# never hits 7 days of inactivity and gets auto-paused.
on:
  schedule:
    # Runs at 06:00 UTC every 3rd day. Well inside the 7-day pause window.
    - cron: '0 6 */3 * *'
  # Lets you trigger it manually from the Actions tab too.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase REST API
        run: |
          echo "Pinging Supabase to keep the project active..."
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://spittswvqstzmmqwhwqe.supabase.co/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Supabase responded with HTTP $HTTP"
          # 200 = OK, 206 = partial content (range) — both mean the DB answered.
          if [ "$HTTP" = "200" ] || [ "$HTTP" = "206" ]; then
            echo "Keep-alive successful."
          else
            echo "Unexpected status code: $HTTP"
            exit 1
          fi
        env:
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNwaXR0c3d2cXN0em1tcXdod3FlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMzUzNjksImV4cCI6MjA5NDYxMTM2OX0.msbeE9m7OApVCb3ogaQrKd3n_9nSYt7KDHiJTbj42MM
